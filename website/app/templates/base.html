<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Trading Journal{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="/">Trading Journal</a>
      <nav class="sidebar-nav">
        <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}">Dashboard</a>
        <a href="/risk-management" class="{{ 'active' if request.url.path.startswith('/risk-management') else '' }}">Risk Management</a>
        <a href="/analytics" class="{{ 'active' if request.url.path.startswith('/analytics') else '' }}">Analytics</a>
        <a href="/tax-report" class="{{ 'active' if request.url.path.startswith('/tax-report') else '' }}">Tax Report</a>
        <a href="/positions" class="{{ 'active' if request.url.path.startswith('/positions') else '' }}">Trades</a>
        <a href="/insights" class="{{ 'active' if request.url.path.startswith('/insights') else '' }}">Insights</a>
      </nav>
      {% if request.session.get('authenticated') %}
      <form method="post" action="/logout" class="sidebar-logout">
        <button type="submit">Log out</button>
      </form>
      {% endif %}
    </aside>
    <main class="container">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
